<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生活記録：アイコン生成</title>
  <style>
    body {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      color: #202a35;
      font-family: system-ui, sans-serif;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      padding: 16px;
      border: 1px solid #dce2e7;
      border-radius: 14px;
    }

    img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
    }

    a {
      display: inline-block;
      padding: 10px;
      color: #25694b;
    }

    #status {
      color: #66717d;
    }
  </style>
</head>
<body>
  <h1>生活記録のアイコン生成</h1>
  <p>
    3つのリンクをそれぞれクリックし、画像を保存してください。
    保存した画像は、名前を変更せずアプリのフォルダーへ移動してください。
  </p>

  <div id="icons"></div>
  <p id="status">画像を生成しています。</p>

  <script>
    "use strict";

    const specs = [
      { size: 192, name: "icon-192.png" },
      { size: 512, name: "icon-512.png" },
      { size: 180, name: "apple-touch-icon.png" }
    ];

    const urls = [];

    function generateIcon(spec) {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement("canvas");
        canvas.width = spec.size;
        canvas.height = spec.size;

        const context = canvas.getContext("2d");

        if (!context) {
          reject(new Error("Canvasを利用できません。"));
          return;
        }

        const size = spec.size;

        context.fillStyle = "#edf6ef";
        context.fillRect(0, 0, size, size);

        context.strokeStyle = "#25694b";
        context.lineWidth = size * 0.065;
        context.beginPath();
        context.arc(
          size * 0.5,
          size * 0.45,
          size * 0.19,
          0,
          Math.PI * 2
        );
        context.stroke();

        context.fillStyle = "#25694b";

        for (let index = 0; index < 3; index += 1) {
          context.beginPath();
          context.arc(
            size * (0.38 + index * 0.12),
            size * 0.76,
            size * 0.025,
            0,
            Math.PI * 2
          );
          context.fill();
        }

        canvas.toBlob((blob) => {
          if (!blob) {
            reject(new Error("画像を生成できませんでした。"));
            return;
          }

          const url = URL.createObjectURL(blob);
          urls.push(url);

          const item = document.createElement("div");
          item.className = "item";

          const image = document.createElement("img");
          image.src = url;
          image.alt = `${spec.size}pxのアイコン`;

          const link = document.createElement("a");
          link.href = url;
          link.download = spec.name;
          link.textContent = `${spec.name} を保存`;

          item.append(image, link);
          resolve(item);
        }, "image/png");
      });
    }

    Promise.all(specs.map(generateIcon))
      .then((items) => {
        document.getElementById("icons").append(...items);
        document.getElementById("status").textContent =
          "生成できました。3ファイルとも保存してください。";
      })
      .catch((error) => {
        document.getElementById("status").textContent = error.message;
      });

    window.addEventListener("unload", () => {
      urls.forEach((url) => URL.revokeObjectURL(url));
    });
  </script>
</body>
</html>
